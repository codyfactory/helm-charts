name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: codyfactory-private
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: mise run verify
      - name: Verify published archive history
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/history.mjs "$BASE"
