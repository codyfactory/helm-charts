accessBroker:
  enabled: true
  tlsSecret: broker-server-tls
  feedTLSSecret: broker-feed-tls
  caSecret: broker-ca
  clientCASecret: broker-client-ca
  clientSigningSecret: broker-client-signer
  networkPolicy:
    provider: external
    externalEnforcementConfigured: true
  identities:
    - agentUID: example-agent-uid
      agentNamespace: default
      agentName: sre
      identity:
        Namespace: default
        Name: sre-reader
        UID: example-service-account-uid
