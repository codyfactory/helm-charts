{{- if and .Values.accessBroker.enabled .Values.accessBroker.packages.enabled (eq .Values.accessBroker.networkPolicy.provider "cilium") }}
{{- $hosts := concat .Values.accessBroker.packages.upstreamHosts (include "cody.packageDownloadHosts" . | fromJsonArray) | uniq }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-packages-broker
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Release.Name }}-broker-packages
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
          matchExpressions:
            - key: cody.so/sandbox
              operator: Exists
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: {{ printf "%s-broker-feed.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
              {{- range $hosts }}
              - matchName: {{ lower . | quote }}
              {{- end }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app: {{ .Release.Name }}-execution-plane
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        {{- range $hosts }}
        - matchName: {{ lower . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            {{- range $hosts }}
            - {{ lower . | quote }}
            {{- end }}
{{- end }}
