{{- if and .Values.receipts.initializeOnInstall .Release.IsUpgrade }}
{{- fail "Receipt initialization is forbidden on upgrade" }}
{{- end }}
{{- if and .Release.IsInstall .Values.receipts.initializeOnInstall }}
{{- $claims := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "" }}
{{- if $claims.items }}
{{- fail "Retained claims require manual diagnosis; fresh initialization refused" }}
{{- end }}
{{- end }}
{{- if not .Values.installationTokenSecret }}
{{- $name := include "cody.installationSecret" . }}
{{- if and .Release.IsInstall (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- fail "Existing installation Secret cannot be adopted" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  token: {{ required "Installation credential required" .Values.installationToken | quote }}
---
{{- end }}
{{- if not .Values.workerTokenSecret }}
{{- $name := include "cody.workerSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and .Release.IsInstall $existing }}
{{- fail "Existing worker Secret cannot be adopted" }}
{{- end }}
{{- $token := "" }}
{{- if .Release.IsUpgrade }}
{{- if or (not $existing) (ne (index $existing.metadata.annotations "meta.helm.sh/release-name") .Release.Name) (ne (index $existing.metadata.annotations "meta.helm.sh/release-namespace") .Release.Namespace) (ne (index $existing.metadata.labels "app.kubernetes.io/managed-by") "Helm") }}
{{- fail "Existing release-owned worker Secret required; replacement forbidden" }}
{{- end }}
{{- $token = index $existing.data "token" | b64dec }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{43}$" $token) }}
{{- fail "Invalid saved worker credential" }}
{{- end }}
{{- else }}
{{- $token = randAlphaNum 43 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
