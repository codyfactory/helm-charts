{{- $broker := .Values.accessBroker -}}
{{- if and $broker.azure.enabled (not $broker.enabled) -}}
{{- fail "accessBroker.azure.enabled requires accessBroker.enabled" -}}
{{- end -}}
{{- if $broker.enabled -}}
{{- $tls := required "accessBroker.tlsSecret is required" $broker.tlsSecret -}}
{{- $feedTLS := required "accessBroker.feedTLSSecret is required" $broker.feedTLSSecret -}}
{{- $ca := required "accessBroker.caSecret is required" $broker.caSecret -}}
{{- if lt (int $broker.replicas) 2 -}}{{- fail "accessBroker.replicas must be at least 2" -}}{{- end -}}
{{- if not (or (and (eq $broker.networkPolicy.provider "cilium") .Values.networkPolicy.enabled) (and (eq $broker.networkPolicy.provider "external") $broker.networkPolicy.externalEnforcementConfigured)) -}}
{{- fail "Broker requires enabled Cilium enforcement or explicitly configured external equivalent enforcement" -}}
{{- end -}}
{{- $modes := list "kubernetes" -}}
{{- if $broker.azure.enabled -}}{{- $modes = append $modes "azure" -}}{{- end -}}
{{- range $mode := $modes }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}
spec:
  replicas: {{ $broker.replicas }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-broker-{{ $mode }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-broker-{{ $mode }}
        cody.so/broker: {{ $.Release.Name | quote }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-broker-{{ $mode }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ $.Values.image | quote }}
          command: [/cody-execution]
          args:
            - broker
            - --mode={{ $mode }}
            - --listen=:8443
            - --tls-cert=/etc/cody/broker-tls/tls.crt
            - --tls-key=/etc/cody/broker-tls/tls.key
            - --feed-url=https://{{ $.Release.Name }}-broker-feed.{{ $.Release.Namespace }}.svc.cluster.local:8444
            - --feed-ca=/etc/cody/feed-ca/ca.crt
            - --feed-token-file=/var/run/secrets/cody-broker/token
            - --identity-freshness={{ $broker.identityFreshness }}
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          volumeMounts:
            - name: tls
              mountPath: /etc/cody/broker-tls
              readOnly: true
            - name: ca
              mountPath: /etc/cody/feed-ca
              readOnly: true
            - name: feed-token
              mountPath: /var/run/secrets/cody-broker
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ $tls | quote }}
        - name: ca
          secret:
            secretName: {{ $ca | quote }}
        - name: feed-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $broker.audience | quote }}
                  expirationSeconds: 600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Release.Name }}-broker-{{ $mode }}
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}-pods
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-broker-{{ $mode }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-broker-{{ $mode }}-pods
{{- range $index, $identity := $broker.identities }}
{{- if or (eq $mode "kubernetes") $identity.identity.AzureClientID }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}-{{ $index }}
  namespace: {{ required "Broker identity namespace is required" $identity.identity.Namespace }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [{{ required "Broker identity serviceAccount is required" $identity.identity.Name | quote }}]
    verbs: [get, watch{{ if eq $mode "kubernetes" }}, impersonate{{ end }}]
  {{- if eq $mode "azure" }}
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [{{ $identity.identity.Name | quote }}]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-broker-{{ $mode }}-{{ $index }}
  namespace: {{ $identity.identity.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-broker-{{ $mode }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-broker-{{ $mode }}-{{ $index }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-broker-feed
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-execution-plane
  ports:
    - port: 8444
      targetPort: 8444
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-broker-feed
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-execution-plane
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              cody.so/broker: {{ .Release.Name | quote }}
      ports:
        - port: 8444
{{- end }}

{{- if .Values.accessBroker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-broker-config
data:
  config.json: |
    {{- $azureEndpoint := "" -}}
    {{- if .Values.accessBroker.azure.enabled -}}{{- $azureEndpoint = printf "https://%s-broker-azure.%s.svc.cluster.local/msi/token" .Release.Name .Release.Namespace -}}{{- end }}
    {{ dict "kubernetesEndpoint" (printf "https://%s-broker-kubernetes.%s.svc.cluster.local" .Release.Name .Release.Namespace) "azureEndpoint" $azureEndpoint "caFile" "/broker-ca/ca.crt" "identities" .Values.accessBroker.identities | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-broker-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-broker-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-execution-plane
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-broker-tokenreview
{{- end }}
