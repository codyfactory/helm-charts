{{- if and .Values.accessBroker.packages.enabled (ne .Values.accessBroker.networkPolicy.provider "none") }}
{{- $hosts := list }}
{{- range concat .Values.accessBroker.packages.upstreamHosts (include "cody.packageDownloadHosts" . | fromJsonArray) }}{{- $hosts = append $hosts (lower .) }}{{- end }}
{{- range .Values.networkPolicy.toolDomains }}
{{- if or (contains "*" .) (has (lower .) $hosts) }}
{{- fail "Package registry hosts must not appear in networkPolicy.toolDomains" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.accessBroker.github.enabled (ne .Values.accessBroker.networkPolicy.provider "none") }}
{{- $githubHosts := list }}
{{- range concat .Values.accessBroker.github.upstreamHosts (include "cody.githubDownloadDomains" . | fromJsonArray) }}
{{- $githubHosts = append $githubHosts (lower .) }}
{{- end }}
{{- range .Values.networkPolicy.toolDomains }}
{{- $tool := lower . }}
{{- if contains "*" $tool }}
{{- fail "Brokered GitHub sandbox tool domains must not contain wildcards" }}
{{- end }}
{{- range $host := $githubHosts }}
{{- if and (hasPrefix "*." $host) (regexMatch (printf "^[^.]+\\.%s$" (regexQuoteMeta (trimPrefix "*." $host))) $tool) }}
{{- fail "Brokered GitHub download domains must not appear in networkPolicy.toolDomains" }}
{{- end }}
{{- end }}
{{- if or (has (lower .) $githubHosts) (eq (lower .) "github.com") (eq (lower .) "api.github.com") }}
{{- fail "Brokered GitHub hosts must not appear in networkPolicy.toolDomains" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- range .Values.networkPolicy.toolDomains }}
{{- if or (contains "openrouter" (lower .)) (contains "openai" (lower .)) (contains "anthropic" (lower .)) (contains "*" .) }}
{{- fail "networkPolicy.toolDomains must not permit provider domains or wildcards" }}
{{- end }}
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-sandbox-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: cody.so/sandbox
        operator: Exists
  enableDefaultDeny:
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.cody.so
              - matchName: {{ printf "%s-execution-plane.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
              {{- if .Values.accessBroker.enabled }}
              - matchName: {{ printf "%s-broker-kubernetes.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
              {{- if .Values.accessBroker.github.enabled }}
              - matchName: {{ printf "%s-broker-github.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
              {{- end }}
              {{- if .Values.accessBroker.packages.enabled }}
              - matchName: {{ printf "%s-broker-packages.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
              {{- end }}
              {{- if .Values.accessBroker.azure.enabled }}
              - matchName: {{ printf "%s-broker-azure.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
              - matchName: management.azure.com
              - matchName: api.loganalytics.io
              {{- end }}
              {{- end }}
              {{- range .Values.networkPolicy.toolDomains }}
              - matchName: {{ . | quote }}
              {{- end }}
    - toFQDNs:
        - matchName: api.cody.so
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames: [api.cody.so]
    {{- range .Values.networkPolicy.toolDomains }}
    - toFQDNs:
        - matchName: {{ . | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames: [{{ . | quote }}]
    {{- end }}
    {{- if .Values.accessBroker.enabled }}
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-broker-kubernetes
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    {{- if .Values.accessBroker.github.enabled }}
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-broker-github
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    {{- end }}
    {{- if .Values.accessBroker.packages.enabled }}
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-broker-packages
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    {{- end }}
    {{- if .Values.accessBroker.azure.enabled }}
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-broker-azure
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toFQDNs:
        - matchName: management.azure.com
        - matchName: api.loganalytics.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames: [management.azure.com, api.loganalytics.io]
    {{- end }}
    {{- end }}
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-execution-plane
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
{{- end }}
