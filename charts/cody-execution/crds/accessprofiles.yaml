apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accessprofiles.execution.cody.so
spec:
  group: execution.cody.so
  names:
    kind: AccessProfile
    plural: accessprofiles
    singular: accessprofile
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: has(self.kubernetes) || has(self.github) || has(self.packageRegistries)
                  message: At least one supported access block is required
                - rule: '!has(self.azure) || has(self.kubernetes)'
                  message: Azure requires a Kubernetes ServiceAccount
              properties:
                kubernetes:
                  type: object
                  required: [serviceAccountRef]
                  properties:
                    serviceAccountRef:
                      type: object
                      required: [name]
                      properties:
                        name: {type: string, minLength: 1, maxLength: 253}
                github:
                  type: object
                  required: [connectorRef, repositories, permissions]
                  properties:
                    connectorRef: {type: string, minLength: 1}
                    repositories:
                      type: array
                      minItems: 1
                      maxItems: 500
                      x-kubernetes-list-type: set
                      items: {type: string, minLength: 3}
                    permissions:
                      type: object
                      minProperties: 1
                      additionalProperties: {type: string, enum: [read, write]}
                      x-kubernetes-validations:
                        - rule: self.all(k, k in ['contents', 'pull_requests', 'actions'])
                          message: Only Cody contents, pull_requests and actions capabilities are supported
                        - rule: "!('actions' in self) || self.actions == 'read'"
                          message: Actions capability supports read only
                packageRegistries:
                  type: array
                  minItems: 1
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, endpoints, auth]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 63}
                      endpoints:
                        type: array
                        minItems: 1
                        maxItems: 32
                        x-kubernetes-list-type: set
                        items: {type: string, minLength: 1, maxLength: 2048, pattern: '^https://'}
                      downloadHosts:
                        type: array
                        maxItems: 32
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          minLength: 1
                          maxLength: 253
                          pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                      auth:
                        type: object
                        x-kubernetes-validations:
                          - rule: has(self.bearer) != has(self.basic)
                            message: Exactly one of bearer or basic authentication is required
                        properties:
                          bearer:
                            type: object
                            required: [secretRef]
                            properties:
                              secretRef:
                                type: object
                                required: [name, key]
                                properties:
                                  name: {type: string, minLength: 1, maxLength: 253}
                                  key: {type: string, minLength: 1}
                          basic:
                            type: object
                            required: [secretRef, usernameKey, passwordKey]
                            properties:
                              secretRef:
                                type: object
                                required: [name]
                                properties:
                                  name: {type: string, minLength: 1, maxLength: 253}
                              usernameKey: {type: string, minLength: 1}
                              passwordKey: {type: string, minLength: 1}
                azure:
                  type: object
                  required: [tenantID, clientID, allowedResources]
                  properties:
                    tenantID: {type: string, minLength: 1}
                    clientID: {type: string, minLength: 1}
                    allowedResources:
                      type: array
                      minItems: 1
                      maxItems: 32
                      x-kubernetes-list-type: set
                      items: {type: string, minLength: 1}
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
