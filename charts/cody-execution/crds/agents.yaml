apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.execution.cody.so
spec:
  group: execution.cody.so
  names:
    kind: Agent
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            status:
              type: object
              properties:
                assets:
                  type: object
                  properties:
                    observedGeneration: {type: integer, format: int64}
                    observedUID: {type: string}
                    fingerprint: {type: string}
                    ready: {type: boolean}
                    lastSuccess: {type: string, format: date-time}
                    lastError: {type: string, maxLength: 128}
                    versions:
                      type: array
                      maxItems: 32
                      items:
                        type: object
                        properties:
                          source: {type: string}
                          version: {type: string}
            spec:
              type: object
              required: [image]
              x-kubernetes-preserve-unknown-fields: true
              not:
                required: [harness]
              allOf:
                - not:
                    required: [skills]
                    properties:
                      skills:
                        not: {}
                - not:
                    required: [referenceInputs]
                    properties:
                      referenceInputs:
                        not: {}
              oneOf:
                - required: [codex]
                  not:
                    required: [claude]
                - required: [claude]
                  not:
                    required: [codex]
              x-kubernetes-validations:
                - rule: "has(self.codex) != has(self.claude)"
                  message: Select exactly one codex or claude harness block
              properties:
                accessProfileRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
                image:
                  type: string
                  maxLength: 512
                  pattern: '^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)+(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[a-f0-9]{64}$'
                codex:
                  type: object
                  nullable: true
                  maxProperties: 1
                  additionalProperties:
                    type: string
                    nullable: true
                    enum: [none, minimal, low, medium, high, xhigh]
                  x-kubernetes-validations:
                    - rule: "dyn(self) != null && self.all(k, k == 'reasoningEffort' && dyn(self[k]) != null)"
                      message: codex accepts only a non-null reasoningEffort; use an empty object for high
                claude:
                  type: object
                  nullable: true
                  maxProperties: 1
                  additionalProperties:
                    type: string
                    nullable: true
                    enum: [low, medium, high, max]
                  x-kubernetes-validations:
                    - rule: "dyn(self) != null && self.all(k, k == 'effort' && dyn(self[k]) != null)"
                      message: claude accepts only a non-null effort; use an empty object for high
                skills:
                  type: array
                  nullable: true
                  maxItems: 16
                  items:
                    type: object
                    nullable: true
                    x-kubernetes-preserve-unknown-fields: true
                    maxProperties: 3
                    oneOf:
                      - required: [bundle, names]
                        maxProperties: 3
                      - required: [source]
                        maxProperties: 2
                    properties:
                      auth:
                        type: object
                        default: {public: {}}
                        nullable: true
                        x-kubernetes-preserve-unknown-fields: true
                        minProperties: 1
                        maxProperties: 1
                        properties:
                          public:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            maxProperties: 0
                          secretRef:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            required: [name]
                            maxProperties: 1
                            properties:
                              name:
                                type: string
                                nullable: true
                                minLength: 1
                                maxLength: 253
                                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            x-kubernetes-validations:
                              - rule: "dyn(self.name) != null"
                                message: Secret name must not be null
                          githubApp:
                            type: object
                            nullable: true
                            maxProperties: 1
                            additionalProperties:
                              type: string
                              nullable: true
                              minLength: 1
                              maxLength: 253
                              pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            x-kubernetes-validations:
                              - rule: "dyn(self) != null && self.all(k, k == 'connectorRef' && dyn(self[k]) != null)"
                                message: GitHub App accepts only a non-null connectorRef; omit it for automatic selection
                          acrWorkloadIdentity:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            maxProperties: 0
                        x-kubernetes-validations:
                          - rule: "dyn(self) != null && ((has(self.public) && dyn(self.public) != null) || (has(self.secretRef) && dyn(self.secretRef) != null) || (has(self.githubApp) && dyn(self.githubApp) != null) || (has(self.acrWorkloadIdentity) && dyn(self.acrWorkloadIdentity) != null))"
                            message: Select exactly one non-null authentication block
                      bundle:
                        type: string
                        nullable: true
                        maxLength: 512
                        pattern: '^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)+(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[a-f0-9]{64})$'
                      names:
                        type: array
                        nullable: true
                        minItems: 1
                        maxItems: 32
                        items:
                          type: string
                          nullable: true
                          maxLength: 63
                          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                      source:
                        type: object
                        nullable: true
                        x-kubernetes-preserve-unknown-fields: true
                        required: [git]
                        maxProperties: 1
                        properties:
                          git:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            required: [url, paths]
                            maxProperties: 3
                            oneOf:
                              - required: [revision]
                                maxProperties: 3
                              - not:
                                  required: [revision]
                                maxProperties: 2
                            allOf:
                              - not:
                                  required: [revision]
                                  properties:
                                    revision:
                                      not: {}
                            properties:
                              url:
                                type: string
                                nullable: true
                                maxLength: 2048
                                pattern: '^(https://[^/@?#\s\\]+/[^?#\s\\]+|ssh://[a-zA-Z0-9._-]+@[^/@?#\s\\]+/[^?#\s\\]+|[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+:[^\s?#\\]+)$'
                              revision:
                                type: string
                                nullable: true
                                pattern: '^[a-fA-F0-9]{40}$'
                              paths:
                                type: array
                                nullable: true
                                minItems: 1
                                maxItems: 32
                                items:
                                  type: string
                                  nullable: true
                                  minLength: 1
                                  maxLength: 256
                                  pattern: '^(\.|[^/\\]+(/[^/\\]+)*)$'
                                x-kubernetes-validations:
                                  - rule: "self.all(p, dyn(p) != null && !p.matches('[[:cntrl:]]') && (p == '.' || p.split('/').all(s, s != '.' && s != '..')) && p.split('/').size() <= 16 && p.split('/').all(s, s.size() <= 255))"
                                    message: Git skill paths must be clean repository-relative directories
                                  - rule: "self.all(a, self.filter(b, a == b || a == '.' || b == '.' || a.startsWith(b + '/') || b.startsWith(a + '/')).size() == 1)"
                                    message: Git skill paths must not duplicate or overlap
                            x-kubernetes-validations:
                              - rule: "dyn(self.url) != null && dyn(self.paths) != null"
                                message: Git URL and paths must not be null
                        x-kubernetes-validations:
                          - rule: "dyn(self.git) != null"
                            message: Git source must not be null
                  x-kubernetes-validations:
                    - rule: "dyn(self) != null && self.all(s, dyn(s) != null && dyn(s.auth) != null && (has(s.source) ? dyn(s.source) != null : has(s.bundle) && has(s.names) && dyn(s.bundle) != null && dyn(s.names) != null && s.names.all(n, dyn(n) != null)))"
                      message: Select either a Git source or an OCI bundle with non-null names
                    - rule: "self.all(a, !has(a.names) || a.names.all(n, a.names.filter(x, x == n).size() == 1 && self.filter(b, has(b.names) && n in b.names).size() == 1))"
                      message: Selected OCI skill names must be unique across bundles
                    - rule: "self.all(s, !has(s.auth) ? (!has(s.source) || s.source.git.url.startsWith('https://')) : (!has(s.auth.public) || !has(s.source) || s.source.git.url.startsWith('https://')) && (!has(s.auth.githubApp) || has(s.source) && s.source.git.url.matches('^https://(?i:github[.]com)/')) && (!has(s.auth.acrWorkloadIdentity) || has(s.bundle) && s.bundle.matches('^[a-z0-9.-]+[.]azurecr[.]io/')))"
                      message: Authentication must match the selected source provider
                    - rule: "self.map(s, has(s.source) ? s.source.git.paths.size() : s.names.size()).sum() <= 64"
                      message: Select at most 64 skills
                referenceInputs:
                  type: array
                  nullable: true
                  maxItems: 16
                  items:
                    type: object
                    nullable: true
                    required: [name, bundle]
                    maxProperties: 3
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      auth:
                        type: object
                        default: {public: {}}
                        nullable: true
                        x-kubernetes-preserve-unknown-fields: true
                        minProperties: 1
                        maxProperties: 1
                        properties:
                          public:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            maxProperties: 0
                          secretRef:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            required: [name]
                            maxProperties: 1
                            properties:
                              name:
                                type: string
                                nullable: true
                                minLength: 1
                                maxLength: 253
                                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            x-kubernetes-validations:
                              - rule: "dyn(self.name) != null"
                                message: Secret name must not be null
                          githubApp:
                            type: object
                            nullable: true
                            maxProperties: 1
                            additionalProperties:
                              type: string
                              nullable: true
                              minLength: 1
                              maxLength: 253
                              pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            x-kubernetes-validations:
                              - rule: "dyn(self) != null && self.all(k, k == 'connectorRef' && dyn(self[k]) != null)"
                                message: GitHub App accepts only a non-null connectorRef; omit it for automatic selection
                          acrWorkloadIdentity:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                            maxProperties: 0
                        x-kubernetes-validations:
                          - rule: "dyn(self) != null && ((has(self.public) && dyn(self.public) != null) || (has(self.secretRef) && dyn(self.secretRef) != null) || (has(self.githubApp) && dyn(self.githubApp) != null) || (has(self.acrWorkloadIdentity) && dyn(self.acrWorkloadIdentity) != null))"
                            message: Select exactly one non-null authentication block
                      name:
                        type: string
                        nullable: true
                        maxLength: 63
                        pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                      bundle:
                        type: string
                        nullable: true
                        maxLength: 512
                        pattern: '^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)+(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[a-f0-9]{64})$'
                  x-kubernetes-validations:
                    - rule: "dyn(self) != null && self.all(r, dyn(r) != null && dyn(r.auth) != null && dyn(r.name) != null && dyn(r.bundle) != null)"
                      message: referenceInputs must contain non-null names and bundles
                    - rule: "self.all(r, !has(r.auth) || !has(r.auth.githubApp) && (!has(r.auth.acrWorkloadIdentity) || r.bundle.matches('^[a-z0-9.-]+[.]azurecr[.]io/')))"
                      message: Reference authentication must match the OCI registry
                    - rule: "self.all(a, self.filter(b, a.name == b.name).size() == 1)"
                      message: Reference input names must be unique
                agentsMD:
                  description: Standing instructions for the Agent, supplied alongside repository instructions.
                  type: string
                  minLength: 1
                  maxLength: 4096
                requiredCapabilities:
                  type: array
                  items:
                    type: string
                    enum: [steering, interruption, resumption, approvals, nativeSubagents]
                inference:
                  type: object
                  required: [endpoint, model]
                  properties:
                    endpoint:
                      type: string
                      minLength: 1
                      pattern: "^https://[^/?#@]+(/[^?#]*)?$"
                    model:
                      type: string
                      minLength: 1
                credentialRef:
                  type: object
                  required: [secretName, key]
                  properties:
                    secretName:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
